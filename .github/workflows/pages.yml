name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — this just
# publishes the repository root.
#
# NOT on push. GitHub's Pages publishing queue stalled for hours on 6 Aug
# 2026 — five runs in a row uploaded the artifact in two seconds and then sat
# at deployment_queued until deploy-pages hit its ten-minute ceiling — so the
# site was moved to Pages' other publishing route: Settings → Pages → Source
# → Deploy from a branch → main → / (root). That route does not involve this
# workflow at all.
#
# It stays here, on manual dispatch only, for when the queue is healthy again
# and it is worth switching back. Two reasons it must not run automatically:
# configure-pages below would flip the Source back to GitHub Actions on the
# next push, and a stalled deploy fails noisily for no reason.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Build the gallery manifest
        # Rebuilt on every deploy, so adding a photo or video to
        # assets/gallery/ is all it takes for it to appear on the site.
        run: python3 tools/build-gallery.py

      - name: Configure Pages
        # No enablement here: it would set the Source back to GitHub Actions,
        # and while the site publishes from the main branch that is exactly
        # what must not happen by accident. Running this workflow by hand is
        # a deliberate switch back, so turn the Source over in Settings too.
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        # Ten minutes is the ceiling, not a default: deploy-pages clamps any
        # larger timeout back down and says so in the log. So when GitHub's
        # publishing queue holds a deployment at deployment_queued for longer
        # than that, the deploy fails and the only remedy is a fresh run —
        # re-running the job uploads a second github-pages artifact, which
        # deploy-pages then refuses to choose between.
        uses: actions/deploy-pages@v4
