name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — this just
# publishes the repository root on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Build the gallery manifest
        # Rebuilt on every deploy, so adding a photo or video to
        # assets/gallery/ is all it takes for it to appear on the site.
        run: python3 tools/build-gallery.py

      - name: Configure Pages
        # enablement turns Pages on for the repository if it is still off,
        # so no manual visit to Settings is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
